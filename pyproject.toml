[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbender"
version = "0.1.0"
description = "FlowBender: feedback-aware ControlNet training for Stable Diffusion 3.5 (image-to-image experiments)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Gilo" },
    { name = "Sven Elflein" },
    { name = "Ido Sobol" },
    { name = "Or Litany" },
]
dependencies = [
    "torch>=2.10",
    "torchvision>=0.25",
    "diffusers[torch]>=0.37",
    "transformers>=5.2",
    "huggingface-hub>=1.5",
    "accelerate>=1.12",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=2.4",
    "Pillow>=12.1",
    "tqdm>=4.67",
    "wandb>=0.25",
    "torchmetrics>=1.9",
    "einops>=0.8",
    "matplotlib>=3.10",
    "cyclopts>=4.6",
    "clean-fid>=0.1.35",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.20404"
"Project Page" = "https://flow-bender.github.io/"

[tool.setuptools.packages.find]
include = ["sd3*"]
namespaces = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I001", "TID252"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true 
